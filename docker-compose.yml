# ==============================================================================
# TextPup Docker Compose Configuration
#
# Quickstart:
#   1. Copy environment template:
#      cp .env.example .env
#   2. Launch TextPup:
#      docker compose up -d
#   3. Retrieve the first-run Setup Token from logs (if not set in .env):
#      docker compose logs textpup
#   4. Open http://localhost:8080 in your browser to begin the Setup Wizard.
# ==============================================================================

services:
  textpup:
    # Build from local repository source
    build:
      context: .
      dockerfile: Dockerfile

    # Alternatively, pull pre-built container from GitHub Packages:
    # image: ghcr.io/your-org/textpup-service:latest

    container_name: textpup
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - NODE_ENV=production

      # WebAuthn Passkeys: Domain & Origin
      # For local dev / LAN: RP_ID=localhost, RP_ORIGIN=http://localhost:8080
      # For production HTTPS: RP_ID=sms.example.com, RP_ORIGIN=https://sms.example.com
      - RP_ID=${RP_ID:-localhost}
      - RP_ORIGIN=${RP_ORIGIN:-http://localhost:8080}

      # First-run bootstrap setup token (optional; auto-generated on first boot if blank)
      - APP_SETUP_TOKEN=${APP_SETUP_TOKEN:-}

      # Minutes of inactivity before crypto vault auto-locks active keys in RAM (default: 30)
      - VAULT_AUTO_LOCK_MINUTES=${VAULT_AUTO_LOCK_MINUTES:-30}

    volumes:
      # Named volume for persistent SQLite DB, encryption keys, and encrypted MMS media
      - textpup_data:/data

      # Alternatively, mount to a local folder on your host machine:
      # - ./data:/data

volumes:
  textpup_data:
    driver: local
