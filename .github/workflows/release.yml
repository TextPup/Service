name: Service Build, Test & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release Version Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test

  release:
    name: Build Docker, Publish to GHCR & Release Download
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: vars
        run: |
          RAW_TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          # Ensure tag starts with 'v'
          if [[ ! "$RAW_TAG" =~ ^v ]]; then
            TAG="v$RAW_TAG"
          else
            TAG="$RAW_TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "raw_version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        id: docker_build
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/textpup-service"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          TAG="${{ steps.vars.outputs.tag }}"
          
          docker build -t "$IMAGE_NAME:$TAG" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:$TAG"
          docker push "$IMAGE_NAME:latest"

          # Export compressed image tarball for offline / direct release download
          echo "Saving standalone Docker image archive..."
          docker save "$IMAGE_NAME:$TAG" | gzip > "textpup-service-docker-${TAG}.tar.gz"

          # Create deployment bundle with compose file
          tar -czf "textpup-service-deploy-${TAG}.tar.gz" docker-compose.yml .env.example README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: TextPup Service ${{ steps.vars.outputs.tag }}
          files: |
            textpup-service-docker-${{ steps.vars.outputs.tag }}.tar.gz
            textpup-service-deploy-${{ steps.vars.outputs.tag }}.tar.gz
            docker-compose.yml
            .env.example
          generate_release_notes: true
